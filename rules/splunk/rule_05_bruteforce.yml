id: "SPL-005"
name: "OWASP - Web Authentication Brute Force"
description: "Detects excessive 401/403 HTTP status responses from a single IP"
severity: "medium"
cron_schedule: "*/5 * * * *"
search: >
  index=web_docker_logs status=401 OR status=403 | bucket _time span=1m | stats count by src_ip, status, _time | where count > 15
