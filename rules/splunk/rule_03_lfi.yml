id: "SPL-003"
name: "OWASP - Local File Inclusion / Path Traversal"
description: "Detects attempts to access sensitive system files via path traversal"
severity: "high"
mitre: "T1083"
cron_schedule: "*/5 * * * *"
search: >
  index=main sourcetype=bestrio:api:json (path="*../*" OR path="*..%2F*" OR path="*etc/passwd*" OR path="*win.ini*")
  | stats count by src_ip, path, status
  | where count > 0
