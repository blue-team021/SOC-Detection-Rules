id: "SPL-009"
name: "MITRE ATT&CK - Web Server Spawning Shell"
description: "Detects a web server process spawning a command shell (requires Sysmon)"
severity: "critical"
mitre: "T1505.003"
cron_schedule: "*/5 * * * *"
search: >
  index=main sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 (ParentImage="*\\w3wp.exe" OR ParentImage="*\\nginx.exe" OR ParentImage="*\\httpd.exe") (Image="*\\cmd.exe" OR Image="*\\powershell.exe")
  | stats count by _time, Computer, ParentImage, Image
