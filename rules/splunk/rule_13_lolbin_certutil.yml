id: "SPL-013"
name: "MITRE ATT&CK - Certutil File Download (LOLBIN)"
description: "Detects certutil.exe downloading a remote payload (4688, needs command-line auditing GPO)"
description_az: "certutil.exe vasitesile internetden fayl yuklenmesini askar edir (LOLBIN texnikasi). Zererli faylin endirilmesi ucun istifade olunur. 4688 ve command-line audit GPO teleb edir. Oncelik: yuksek."
severity: "high"
mitre: "T1105"
cron_schedule: "*/5 * * * *"
search: >
  index=main sourcetype=WinEventLog:Security EventCode=4688 New_Process_Name="*\\certutil.exe" (Process_Command_Line="*-urlcache*" OR Process_Command_Line="*http*")
  | stats count by _time, ComputerName, Account_Name, Process_Command_Line
