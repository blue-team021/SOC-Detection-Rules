id: "SPL-007"
name: "MITRE ATT&CK - Encoded PowerShell Execution"
description: "Detects Base64/encoded PowerShell via process creation (4688, needs command-line auditing GPO)"
description_az: "Kodlasdirilmis (Base64) PowerShell emrinin isledilmesini askar edir; zererli proqramlar emri gizlemek ucun bunu istifade edir. Process creation (4688) ve command-line audit GPO teleb edir. Oncelik: yuksek."
severity: "high"
mitre: "T1059.001"
cron_schedule: "*/5 * * * *"
search: >
  index=main sourcetype=WinEventLog:Security EventCode=4688 New_Process_Name="*\\powershell.exe" (Process_Command_Line="*-enc*" OR Process_Command_Line="*-EncodedCommand*" OR Process_Command_Line="*FromBase64String*")
  | stats count by _time, ComputerName, Account_Name, Process_Command_Line
