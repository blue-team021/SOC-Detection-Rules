id: "SPL-011"
name: "MITRE ATT&CK - DCSync Active Directory Replication"
description: "Detects Directory Service replication (DCSync) requests via the replication GUID"
description_az: "DCSync hucumunu askar edir: adi istifadeci Active Directory replikasiya huququ ile butun parol hashlerini kopyalamaga calisir (Event 4662, replikasiya GUID). Oncelik: kritik."
severity: "critical"
mitre: "T1003.006"
cron_schedule: "*/5 * * * *"
search: >
  index=main sourcetype=WinEventLog:Security EventCode=4662 Properties="*1131f6aa-9c0e-11d1-a79f-0000f875ae93*"
  | stats count by _time, Account_Name, ComputerName
