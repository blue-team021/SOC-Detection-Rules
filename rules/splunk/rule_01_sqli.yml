id: "SPL-001"
name: "OWASP - SQL Injection (SQLi) Attempt Detected"
description: "Detects SQL injection patterns in web access logs"
severity: "high"
cron_schedule: "*/5 * * * *"
search: >
  index=web_docker_logs (uri="*UNION*" OR uri="*SELECT*" OR uri="*OR*1=1*" OR uri="*%27*" OR uri="*SLEEP(*" OR uri="*--*") | stats count min(_time) as firstTime max(_time) as lastTime by src_ip, uri, status, http_user_agent | where count > 0
