id: "SPL-001"
name: "OWASP - SQL Injection (SQLi) Attempt Detected"
description: "Detects SQL injection patterns in web API request paths"
severity: "high"
mitre: "T1190"
cron_schedule: "*/5 * * * *"
search: >
  index=main sourcetype=bestrio:api:json (path="*UNION*" OR path="*SELECT*" OR path="*1=1*" OR path="*%27*" OR path="*--*" OR path="*' OR '*" OR path="*SLEEP(*")
  | stats count min(_time) as firstTime max(_time) as lastTime by src_ip, path, status, user_agent
  | where count > 0
