id: "SPL-006"
name: "MITRE ATT&CK - LSASS Process Memory Dump"
description: "Detects credential dumping attempts targeting lsass.exe (requires Sysmon)"
description_az: "LSASS prosesinin yaddasinin dump edilmesini askar edir (Mimikatz kimi aletlerle parol/hash ogurlugu). Sysmon teleb edir. Oncelik: kritik."
severity: "critical"
mitre: "T1003.001"
cron_schedule: "*/5 * * * *"
search: >
  index=main sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=10 TargetImage="*\\lsass.exe" (GrantedAccess="0x1010" OR GrantedAccess="0x1410" OR GrantedAccess="0x143a")
  | stats count by _time, Computer, SourceImage, TargetImage, GrantedAccess
