id: "SPL-002"
name: "OWASP - Cross-Site Scripting (XSS) Attack Detected"
description: "Detects inline JavaScript injection in URI parameters"
severity: "high"
cron_schedule: "*/5 * * * *"
search: >
  index=web_docker_logs (uri="*%3Cscript*" OR uri="*<script*" OR uri="*onerror=*" OR uri="*onload=*" OR uri="*javascript:*") | stats count by src_ip, uri, status | where count > 0
