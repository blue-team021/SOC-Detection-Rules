id: "SPL-002"
name: "OWASP - Cross-Site Scripting (XSS) Attack Detected"
description: "Detects inline JavaScript injection in web API request paths"
description_az: "Veb API sorgularinda XSS (Cross-Site Scripting) hucumunu askar edir: <script>, onerror=, javascript: kimi JavaScript yeritme cehdlerini axtarir. Meqsed: istifadecinin brauzerinde zererli kod islemek. Oncelik: yuksek."
severity: "high"
mitre: "T1059.007"
cron_schedule: "*/5 * * * *"
search: >
  index=main sourcetype=bestrio:api:json (path="*<script*" OR path="*%3Cscript*" OR path="*onerror=*" OR path="*onload=*" OR path="*javascript:*")
  | stats count by src_ip, path, status, user_agent
  | where count > 0
