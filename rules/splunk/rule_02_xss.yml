id: "SPL-002"
name: "OWASP - Cross-Site Scripting (XSS) Attack Detected"
description: "Detects inline JavaScript injection in web API request paths"
severity: "high"
mitre: "T1059.007"
cron_schedule: "*/5 * * * *"
search: >
  index=main sourcetype=bestrio:api:json (path="*<script*" OR path="*%3Cscript*" OR path="*onerror=*" OR path="*onload=*" OR path="*javascript:*")
  | stats count by src_ip, path, status, user_agent
  | where count > 0
